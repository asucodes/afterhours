<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="20" fill="#172126"/><style>text{font-family:monospace;fill:#d8dfc7}.label{font-size:16px}.small{font-size:12px;fill:#9eb39a}.box{fill:#293b32;stroke:#647b58;stroke-width:2}.line{stroke:#d8bb83;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d8bb83"/></marker></defs><text x="40" y="48" font-size="25">AFTERHOURS / THE NIGHT SHIFT</text><text x="40" y="78" class="small">A versioned sourcing service. An RPG office you can direct.</text><rect class="box" x="40" y="145" width="220" height="130" rx="10"/><text x="62" y="180" class="label">PIXEL OFFICE</text><text x="62" y="208" class="small">React + tile map</text><text x="62" y="232" class="small">Supervisor + case workspace</text><path class="line" d="M260 210H320"/><rect class="box" x="330" y="145" width="230" height="130" rx="10"/><text x="352" y="180" class="label">WORKFLOW ENGINE</text><text x="352" y="208" class="small">Brief versions + task graph</text><text x="352" y="232" class="small">Evidence + human decisions</text><path class="line" d="M560 180H650V150H700"/><path class="line" d="M560 235H650V285H700"/><rect class="box" x="710" y="105" width="340" height="100" rx="10"/><text x="735" y="140" class="label">TOKENHARBOR / DEEPSEEK</text><text x="735" y="168" class="small">Interpret · select · assess · write</text><rect class="box" x="710" y="240" width="340" height="100" rx="10"/><text x="735" y="275" class="label">CRUSTDATA MCP</text><text x="735" y="303" class="small">Company · people · web evidence</text><path class="line" d="M445 275V355"/><rect class="box" x="330" y="365" width="230" height="90" rx="10"/><text x="352" y="400" class="label">SQLITE</text><text x="352" y="426" class="small">Cases · events · cache · inbox</text><path class="line" d="M330 410H150V285"/><text x="45" y="392" class="small">SSE snapshots</text><text x="710" y="401" class="small">Change a requirement:</text><text x="710" y="425" class="small">keep valid evidence, revisit affected work.</text><text x="710" y="449" class="small">No outside outreach or booking.</text></svg>
